<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelikeskus - Etusivu</title>
    <style>
        * {
            box-sizing: border-box;
        }
        /* Yleiset tyylit */
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Header-tyylit */
        header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 40px;
            background-color: rgba(0, 0, 0, 0.55);
            padding: 15px 35px;
            border-radius: 12px;
        }
        h1 {
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            color: #ffffff;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
        }
        header p {
            color: #f0f0f0;
            font-size: 1.15rem;
            margin: 0;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
        }
        /* Keskellä oleva pelaa laatikko */
        .game-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }
        /* Pelikortin tyylit */
        .game-card {
            background-color: rgba(35, 35, 35, 0.92);
            border-radius: 16px;
            padding: 55px 45px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 2px solid #444;
            transition: transform 0.2s, border-color 0.2s;
        }
        /* Hover-efekti pelikortille */
        .game-card:hover {
            transform: translateY(-5px);
            border-color: #4CAF50;
        }
        /* Pelikortin otsikon ja kuvauksen tyylit */
        .game-card h3 {
            margin-top: 0;
            font-size: 2.3rem;
        }
        /* Pelikortin kuvauksen tyylit */
        .game-card p {
            color: #cccccc;
            font-size: 1.3rem;
            margin-bottom: 25px;
        }
        /* Pelaa-painikkeen tyylit */
        .btn {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 16px 45px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.35rem;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        /* Hover-efekti pelaa-painikkeelle */
        .btn:hover {
            background-color: #45a049;
        }
        /* Taustakuva ja overlay-efekti */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('eiffel-torni.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: scale(1.1);
            z-index: -2;
            filter: blur(2px) brightness(130%);
        }
        /* Overlay-efekti taustakuvan päällä */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4); 
            z-index: -1;
        }
    </style>
</head>
<body>  
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <header>
        <h1>Pelikeskus</h1>
        <p>Valitse alta peli ja aloita pelaaminen!</p>
    </header>

    <main class="game-grid">
        <div class="game-card">
            <h3>Lower or Higher</h3>
            <p>Arvaa, onko seuraava isompi vai pienempi!</p>
            <a href="lower-higher.html" class="btn">Pelaa</a>
        </div>
    </main>

</body>
</html>
