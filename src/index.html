<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelikeskus - Etusivu</title>
    <style>
        * {
            box-sizing: border-box;
        }
        /* Yleiset tyylit */
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #C88A39;
            margin: 0;
            padding: 25px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Header-tyylit */
        header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 0px;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 50px 50px;
            border-radius: 24px;
        }
        h1 {
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            color: #C88A39;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
        }
        header p {
            color: #C88A39;
            font-size: 1.15rem;
            margin: 0;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
        }
        /* Keskellä oleva pelaa laatikko */
        .game-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }
        /* Pelikortin tyylit */
        .game-card {
            background-color: rgba(0, 0, 0, 0.75);
            border-radius: 16px;
            padding: 100px 50px;
            width: 100%;
            max-width: 750px;
            text-align: center;
            border: 2px solid #444;
            transition: transform 0.2s, border-color 0.2s;
        }
        /* Hover-efekti pelikortille */
        .game-card:hover {
            transform: translateY(10px);
            border-color: #FF9EBA;
        }
        /* Pelikortin otsikon ja kuvauksen tyylit */
        .game-card h3 {
            margin-top: 0;
            font-size: 3.0rem;
        }
        /* Pelikortin kuvauksen tyylit */
        .game-card p {
            color: #C88A39;
            font-size: 1.5rem;
            margin-bottom: 25px;
        }
        /* Pelaa-painikkeen tyylit */
        .btn {
            display: inline-block;
            background-color: #ff5988;
            color: #ffffff;
            padding: 16px 45px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.35rem;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        /* Hover-efekti pelaa-painikkeelle */
        .btn:hover {
            background-color: #ff4e80;
        }
      /* Taustakuva ja overlay-efekti */
     .bg-image {
     position: fixed;
     top: 0;
     left: 0;
     width: 100%;
     height: 100%;
     background-image: url('eiffel.webp');
     background-size: cover;
        
    
     background-position: center top; 
  
     background-repeat: no-repeat;
     background-color: #000;
     z-index: -2;
     filter: blur(0px) brightness(100%);
}
        /* Overlay-efekti taustakuvan päällä */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.03); 
            z-index: -1
        }
    </style>
</head>
<body>  
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <header>
        <h1>Pelikeskus</h1>
    </header>

    <main class="game-grid">
        <div class="game-card">
            <h3>Suurempi Vai Pienempi</h3>
            <p>Paina pelaa-painiketta aloittaaksesi pelaamisen!</p>
            <a href="lower-higher.html" class="btn">Pelaa</a>
        </div>
    </main>

</body>
</html>
